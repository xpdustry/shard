# Every Shard config key at its default. Generated by ConfigSchema; see reference.md.
schema-version: 1

server:
  # The server name shown in the client's server list. (host, live)
  name: "Server"
  # The line under the name in the server list; empty for none (vanilla wrote "off"). (host, live)
  description: ""
  # The message sent to a player when they join; empty for none (vanilla wrote "off"). (world, live)
  motd: ""

net:
  # The game listener's address. The dev box binds 127.0.0.1 only; a VM or host may bind any address. (host, restart)
  bind: 127.0.0.1
  # The game port, TCP and UDP; 0 picks a free one (tests). (host, restart)
  port: 6567
  # The most players on the host at once; 0 for no limit. Admins may join past it. (host, live)
  player-limit: 30
  # Whether clients that report a modified build may join. (host, live)
  allow-custom-clients: false
  # Packets a connection may send in 3 s before it is blacklisted and kicked. (host, live)
  packet-spam-limit: 300
  # Chat packets a connection may send in 2 s before it is blacklisted and kicked. (host, live)
  chat-spam-limit: 20
  # How often entity snapshots go to clients. (world, live)
  snapshot-interval: 200ms

host:
  # The worlds hosted at startup, one entry each: "[<id>=]<map> [<mode>]". The map is a name from maps.vanilla-jar or maps.directory (its file name, or its name tag with _ for spaces, any case); the id defaults to the file name in lower case; the mode is survival, sandbox, attack, pvp or editor (default survival). Empty: nothing until the host console command. (host, restart)
  worlds: []
  # The world a new player joins: fewest (the running world with the fewest players), first (the first running world in host.worlds order) or round-robin. (host, live)
  join: fewest
  # The most players in one world at once, counting transfers on their way in; 0 for no limit. New in Shard. (world, live)
  world-player-limit: 0

maps:
  # A vanilla v160.7 server or desktop jar, whose 18 default maps (maps/default/*.msav) may then be hosted. Empty for none. (host, restart)
  vanilla-jar: ""
  # A directory of custom .msav maps, relative to the working directory (vanilla's config/maps). It may be missing. (host, restart)
  directory: "maps"

intents:
  # Inputs a world's inbox holds between two ticks. Worlds created after a reload read it. New in Shard. (host, live)
  inbox-capacity: 4096
  # Reliable intents one session may have waiting for its world; past it the session is kicked, since reliable input is never dropped. Worlds created after a reload read it. New in Shard. (host, live)
  mailbox-bound: 64
  # Entries one session's mailbox moves into its world's inbox per turn of the round-robin pump. New in Shard. (host, live)
  mailbox-quantum: 16
  # Inbox slots intents never take, kept for joins, leaves and other sources: an eighth of the default capacity. It must stay below intents.inbox-capacity. New in Shard. (host, live)
  inbox-reserve: 512

admin:
  # Whether only whitelisted players may join. (host, live)
  whitelist: false
  # Distinct UUIDs one address may present within admin.uuid-change-period before the address is banned; 0 or 1 disables the check. (host, live)
  uuid-change-limit: 10
  # The window of admin.uuid-change-limit. (host, live)
  uuid-change-period: 3h
  # How long a kicked, banned or vote-kicked player must wait to rejoin (vanilla hard-codes 30 s). (host, live)
  kick-cooldown: 30s

chat:
  # Whether chat and block interaction are rate-limited, and repeat offenders kicked. (host, live)
  anti-spam: true
  # The least time between two messages from one player; 0 to disable. (host, live)
  message-rate-limit: 0s
  # Messages inside the rate limit before the player is kicked; 0 to disable. (host, live)
  message-spam-kick: 3
  # Whether joins and leaves are announced in chat. (world, live)
  show-connect-messages: true
  # Whether player commands are logged. (host, live)
  log-commands: true
  # How long the chat log keeps messages; 0 to keep none. New in Shard. (host, live)
  retention: 30d

game:
  # Whether player positions are corrected and duplicate names or ids are refused. (world, live)
  strict: true
  # Whether players may vote to kick. (world, live)
  votekick: true
  # The window of the block interaction rate limit. (world, live)
  interact-rate-window: 6s
  # Block interactions allowed per window. (world, live)
  interact-rate-limit: 25
  # Block interactions inside one window that get the player kicked. (world, live)
  interact-rate-kick: 60
  # The wait between game over and the next map. (world, live)
  round-extra-time: 12s
  # How a world picks its next map after a game over (vanilla's shufflemode): none ends the game by kicking its players and stopping the world; all, custom and builtin pick at random among game.maps of that kind (custom falls back to the default maps when there is no custom one), never the map just played unless it is the only one. (world, live)
  shuffle: custom
  # A world's map registry: the maps its rotation picks from, by name as in host.worlds. Empty: every map the server can host (vanilla's Maps.all()). New in Shard. (world, live)
  maps: []
  # Whether an empty world keeps simulating at 60 Hz. By default its time freezes (ARCHITECTURE.md §7); vanilla's autoPause=false is true here. (world, live)
  simulate-when-empty: false
  # Whether a world pauses its game while nobody is in it, as vanilla's autoPause: players see it paused, and the first one in resumes it, unless an admin paused it by hand. (world, live)
  auto-pause: false
  # The universe's age in seconds that state snapshots send (vanilla's universe.seconds(), saved as utimei); outside a campaign nothing advances it. (host, restart)
  universe-seconds: 0

persistence:
  # How often a running world writes a checkpoint. Always on (vanilla: autosave=false, every 300 s). (world, live)
  autosave-interval: 1m
  # Where world checkpoints and crash bundles go, one directory per world id, relative to the working directory. (host, restart)
  directory: "data/worlds"
  # Where the console's save and load keep their slots, as <slot>.msav vanilla saves, relative to the working directory (vanilla: config/saves). (host, restart)
  saves-directory: "data/saves"
  # Checkpoint generations kept per world. (world, live)
  keep-recent: 3
  # How long a world stays empty before it hibernates; 0 never hibernates. New in Shard. (world, live)
  hibernate-after: 10m
  # How often a world also writes a checkpoint it keeps for the whole match, for replays; 0 writes none. Rounded up to a multiple of 10 s (600 ticks, the replay keyframe). New in Shard. (world, live)
  match-checkpoints: 0s
  # Whether a world hosted again after a restart, from the same map and mode, goes on from its last checkpoint instead of starting over: the match continues. A match that ended (a game over's reload, a stop) never resumes. New in Shard. (host, restart)
  resume: false

replay:
  # Whether a world records its matches: a view stream to watch in a browser and a replay bundle (match checkpoints every 10 s, the inputs, the hashes). Turns persistence.match-checkpoints on at 10 s if it is off. Reloads live: a world starts recording at its next match checkpoint, in the match under way, and stops (closing the replay) when turned off. New in Shard. (world, live)
  record: false
  # Where replays go, relative to the working directory: bundles/<build>/<match>/ and views/<match>.sview, plus views/<match>/ split for static hosting. Serving them is the web host's job. (host, restart)
  directory: "data/replays"
  # How long replay bundles stay. build: while the Shard build that recorded them runs; a later build deletes them once their view stream is baked (a bundle only replays on its own build). forever: never deleted. (host, restart)
  keep-bundles: build
  # How long published view streams (.sview) stay; 0 keeps them until someone deletes them. (host, restart)
  keep-views: 0s
  # When a PvP match's view stream is published for viewing. after-match: only once the match ends, so nobody watches the other team live. live: segment by segment, like other matches. (world, live)
  pvp-views: after-match
  # In-game replays, watched with the vanilla client in a replay world (note 37 P4). none: browsers only; v1 has no other choice. (host, restart)
  in-game: none

storage:
  # The SQLite database file, relative to the working directory. It must be on a local file system (WAL). (host, restart)
  database: "data/shard.db"
  # SQLite's synchronous mode. full syncs every commit; normal may lose the last commits on power loss. (host, restart)
  synchronous: full
  # Writes that may wait for the writer thread; past it, writes fail fast. (host, restart)
  writer-queue: 4096
  # Reader connections; reads past it wait their turn. (host, restart)
  readers: 4
  # How long a connection waits on a lock before it fails. (host, restart)
  busy-timeout: 5s
  # Where online backups go, including the one taken before a migration. (host, live)
  backup-dir: "data/backups"

ops:
  # Whether the REST/SSE ops API runs (metrics, health, events). (host, restart)
  enabled: true
  # The ops API's address: loopback only. Reach it remotely through an authenticated TLS reverse proxy. (host, restart)
  bind: 127.0.0.1
  # The ops API's port. (host, restart)
  port: 7810

log:
  # The root log level (vanilla: debug=true is debug). (host, live)
  level: info
  # json: one JSON object per line; text: a human pattern. (host, restart)
  format: json
  # A log file, rolled by size, besides stdout; empty for stdout only. (host, restart)
  file: ""
  # The size at which log.file rolls over. (host, restart)
  max-file-size: 5MiB

console:
  # Console commands run once at startup, in order. (host, restart)
  start-commands: []
