# Small, short-lived daemons, for a shared machine. Heavy runs can go to a boat VM through scripts/vm-gradle.sh.
org.gradle.jvmargs=-Xmx1g -XX:+UseSerialGC
org.gradle.daemon.idletimeout=300000
org.gradle.workers.max=4
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
