# Versions checked against Maven Central and the Gradle Plugin Portal on 2026-10-29.
[versions]
junit = "6.1.3"
jackson = "3.2.4"
snakeyaml-engine = "3.2"
sqlite-jdbc = "3.53.4.0"
# 2.0.x is the stable line; 2.1.0 is still alpha. logback 1.6.6 is built against 2.0.19.
slf4j = "2.0.20"
logback = "1.6.6"
# The fork vanilla uses (1.10.2 in v160.7). 1.10.2 has known CVEs; the block format is unchanged, so 1.12.1 reads
# and writes frames vanilla accepts. Compressed bytes may differ from vanilla's: compare frames decompressed.
lz4 = "1.12.1"
zstd = "1.5.7-25"
jmh = "1.37"
jmh-plugin = "0.7.3"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
snakeyaml-engine = { module = "org.snakeyaml:snakeyaml-engine", version.ref = "snakeyaml-engine" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-platform-logging = { module = "org.slf4j:slf4j-jdk-platform-logging", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
lz4 = { module = "at.yawk.lz4:lz4-java", version.ref = "lz4" }
zstd = { module = "com.github.luben:zstd-jni", version.ref = "zstd" }
jmh-core = { module = "org.openjdk.jmh:jmh-core", version.ref = "jmh" }
jmh-annprocess = { module = "org.openjdk.jmh:jmh-generator-annprocess", version.ref = "jmh" }

[plugins]
jmh = { id = "me.champeau.jmh", version.ref = "jmh-plugin" }
